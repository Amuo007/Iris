<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Iris Pointer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        pointer-events: none;
      }
      /* the agent's pointer: glides to each target the way a mouse would */
      #pointer {
        position: absolute;
        left: 0;
        top: 0;
        width: 22px;
        height: 22px;
        opacity: 0;
        transform: translate(-100px, -100px);
        transition: transform 160ms cubic-bezier(0.2, 0.7, 0.2, 1), opacity 160ms ease;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
        z-index: 2;
      }
      #pointer.no-anim {
        transition: none;
      }
      .ripple {
        position: absolute;
        width: 36px;
        height: 36px;
        margin: -18px 0 0 -18px;
        border-radius: 50%;
        border: 2px solid rgba(17, 17, 17, 0.85);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.85);
        animation: ripple 520ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes ripple {
        0% {
          transform: scale(0.35);
          opacity: 1;
        }
        100% {
          transform: scale(1.35);
          opacity: 0;
        }
      }
      #label {
        position: absolute;
        max-width: 320px;
        padding: 4px 9px;
        border-radius: 6px;
        font: 500 11.5px/1.35 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        color: #fff;
        background: rgba(10, 10, 10, 0.88);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transform: translate(14px, 18px);
        transition: left 160ms cubic-bezier(0.2, 0.7, 0.2, 1), top 160ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }
    </style>
  </head>
  <body>
    <svg id="pointer" viewBox="0 0 22 22" aria-hidden="true">
      <path d="M3 2l13.5 9.2-6.1 1.2 3.6 7.1-2.6 1.3-3.6-7.2L3.6 18z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" />
    </svg>
    <div id="label" hidden></div>
    <script>
      const { ipcRenderer } = require('electron')
      const pointer = document.getElementById('pointer')
      const label = document.getElementById('label')
      let hideTimer = null
      let last = null

      function place (x, y, animate) {
        pointer.classList.toggle('no-anim', !animate)
        pointer.style.transform = `translate(${x - 3}px, ${y - 2}px)`
        pointer.style.opacity = '1'
      }

      function ripple (x, y) {
        const r = document.createElement('div')
        r.className = 'ripple'
        r.style.left = x + 'px'
        r.style.top = y + 'px'
        document.body.appendChild(r)
        setTimeout(() => r.remove(), 600)
      }

      ipcRenderer.on('iris-overlay', (event, payload) => {
        if (!payload || !payload.anchor) {
          return
        }
        clearTimeout(hideTimer)
        const { x, y } = payload.anchor
        place(x, y, !!last)
        last = { x, y }
        const type = payload.action && payload.action.type
        if (type && type !== 'move' && type !== 'scroll' && type !== 'zoom') {
          setTimeout(() => ripple(x, y), 150)
        }
        if (payload.description) {
          label.hidden = false
          label.style.left = Math.min(window.innerWidth - 240, x) + 'px'
          label.style.top = Math.min(window.innerHeight - 40, y) + 'px'
          label.textContent = payload.description
        }
        hideTimer = setTimeout(() => {
          label.hidden = true
          pointer.style.opacity = '0.35'
        }, 2400)
      })

      ipcRenderer.on('iris-overlay-hide', () => {
        clearTimeout(hideTimer)
        pointer.style.opacity = '0'
        label.hidden = true
        last = null
      })

      // tell the main process we are ready to be positioned
      ipcRenderer.send('iris-overlay-sync', { ready: true })
    </script>
  </body>
</html>
