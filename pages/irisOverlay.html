<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Iris Pointer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        pointer-events: none;
      }
      /* the agent's pointer (the one in Iris's mark): glides to each target the way a mouse would */
      #pointer {
        position: absolute;
        left: 0;
        top: 0;
        width: 24px;
        height: 29px;
        opacity: 0;
        transform: translate(-100px, -100px);
        transition: transform 220ms cubic-bezier(0.22, 0.75, 0.2, 1), opacity 180ms ease;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35)) drop-shadow(0 0 1px rgba(0, 0, 0, 0.4));
        z-index: 3;
      }
      #pointer.no-anim {
        transition: none;
      }
      #pointer.is-pressing path {
        transform: scale(0.86);
      }
      #pointer path {
        transform-box: fill-box;
        transform-origin: 8% 8%;
        transition: transform 90ms ease;
      }
      /* a click: two rings in Iris blue spread from the tip */
      .ripple {
        position: absolute;
        width: 40px;
        height: 40px;
        margin: -20px 0 0 -20px;
        box-sizing: border-box;
        border-radius: 50%;
        border: 2.5px solid #2f7bff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.6);
        animation: ripple 560ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        z-index: 2;
      }
      .ripple.second {
        border-color: #0aa6c8;
        animation-delay: 110ms;
        opacity: 0;
      }
      @keyframes ripple {
        0% {
          transform: scale(0.3);
          opacity: 1;
        }
        100% {
          transform: scale(1.4);
          opacity: 0;
        }
      }
      #label {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 7px;
        max-width: 320px;
        padding: 5px 10px 5px 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        font: 500 11.5px/1.35 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        color: #fff;
        background: rgba(14, 16, 22, 0.9);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        transform: translate(18px, 24px);
        transition: left 220ms cubic-bezier(0.22, 0.75, 0.2, 1), top 220ms cubic-bezier(0.22, 0.75, 0.2, 1);
      }
      #label[hidden] {
        display: none;
      }
      #label::before {
        content: "";
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8fd8ff, #2f7bff 55%, #10b981);
      }
      #label span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <svg id="pointer" viewBox="204 221 196 236" aria-hidden="true">
      <defs>
        <linearGradient id="pointer-fill" x1=".15" y1="0" x2=".8" y2="1">
          <stop stop-color="#ffffff" />
          <stop offset="1" stop-color="#d6efff" />
        </linearGradient>
      </defs>
      <path
        d="M240 237Q224 225 214 238Q208 245 212 262L235 426Q239 448 252 449Q262 451 270 438L307 384 366 384Q383 384 388 373Q394 362 378 351Z"
        fill="url(#pointer-fill)"
        stroke="#0b1324"
        stroke-width="13"
        stroke-linejoin="round"
      />
    </svg>
    <div id="label" hidden><span id="label-text"></span></div>
    <script>
      const { ipcRenderer } = require('electron')
      const pointer = document.getElementById('pointer')
      const label = document.getElementById('label')
      const labelText = document.getElementById('label-text')
      let hideTimer = null
      let last = null

      function place (x, y, animate) {
        pointer.classList.toggle('no-anim', !animate)
        // the tip of the drawing sits 1.5 px right and 2 px down of the box corner
        pointer.style.transform = `translate(${x - 1.5}px, ${y - 2}px)`
        pointer.style.opacity = '1'
      }

      function ripple (x, y) {
        ['ripple', 'ripple second'].forEach((name) => {
          const r = document.createElement('div')
          r.className = name
          r.style.left = x + 'px'
          r.style.top = y + 'px'
          document.body.appendChild(r)
          setTimeout(() => r.remove(), 800)
        })
        // the pointer presses down as it clicks
        pointer.classList.add('is-pressing')
        setTimeout(() => pointer.classList.remove('is-pressing'), 140)
      }

      ipcRenderer.on('iris-overlay', (event, payload) => {
        if (!payload || !payload.anchor) {
          return
        }
        clearTimeout(hideTimer)
        const { x, y } = payload.anchor
        place(x, y, !!last)
        last = { x, y }
        const type = payload.action && payload.action.type
        if (type && type !== 'move' && type !== 'scroll' && type !== 'zoom') {
          setTimeout(() => ripple(x, y), 210)
        }
        if (payload.description) {
          label.hidden = false
          label.style.left = Math.min(window.innerWidth - 240, x) + 'px'
          label.style.top = Math.min(window.innerHeight - 40, y) + 'px'
          labelText.textContent = payload.description
        }
        hideTimer = setTimeout(() => {
          label.hidden = true
          pointer.style.opacity = '0.35'
        }, 2400)
      })

      ipcRenderer.on('iris-overlay-hide', () => {
        clearTimeout(hideTimer)
        pointer.style.opacity = '0'
        label.hidden = true
        last = null
      })

      // tell the main process we are ready to be positioned
      ipcRenderer.send('iris-overlay-sync', { ready: true })
    </script>
  </body>
</html>
